<script>
const firebaseConfig = {
  apiKey: "AIzaSyD9KTcTyfrXEb1OY1w_e2m8zwnyxNMcons",

firebase.initializeApp(firebaseConfig);

function login(){
 auth.signInWithEmailAndPassword(email.value, password.value)
