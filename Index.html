<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAJAFFI Store</title>

<meta name="description" content="MAJAFFI online store - best deals on gadgets, fashion & accessories in Nigeria">
<meta name="keywords" content="buy online Nigeria, gadgets Lagos, fashion store Nigeria">
<link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">

<style>
body{font-family:Poppins,sans-serif;margin:0;background:#f5f5f5;}
header{background:#111;color:#fff;padding:15px;text-align:center;}
.hero{background:linear-gradient(rgba(0,0,0,0.5),rgba(0,0,0,0.5)),url('https://images.unsplash.com/photo-1607083206869-4c7672e72a8a');background-size:cover;color:white;text-align:center;padding:70px 20px;}
.shop-btn{background:#ff6600;padding:12px 25px;color:white;text-decoration:none;border-radius:6px;}
.container{padding:20px;}
.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:20px;}
.card{background:white;border-radius:15px;padding:15px;text-align:center;box-shadow:0 6px 18px rgba(0,0,0,0.1);transition:0.3s;}
.card:hover{transform:translateY(-5px);}
.card img{width:100%;height:150px;object-fit:cover;border-radius:10px;}
button{background:#111;color:white;border:none;padding:10px;margin-top:8px;cursor:pointer;border-radius:6px;}
#cart{background:white;padding:15px;margin-top:20px;border-radius:10px;}
.dark{background:#111;color:#fff;}
</style>
</head>
<body>

<header>
<h2>MAJAFFI</h2>
<button onclick="toggleDark()">🌙</button>
</header>

<section class="hero">
<h1>Welcome to MAJAFFI</h1>
<p>Shop Quality Products at Unbeatable Prices</p>
<a href="#products" class="shop-btn">Shop Now</a>
</section>

<div class="container">

<!-- AUTH FOR LOGIN/SIGNUP -->
<div id="authBox">
<h3>Create Account</h3>
<input id="signupEmail" placeholder="Email">
<input id="signupPassword" type="password" placeholder="Password">
<button onclick="signUp()">Sign Up</button>

<h3>Login</h3>
<input id="loginEmail" placeholder="Email">
<input id="loginPassword" type="password" placeholder="Password">
<button onclick="login()">Login</button>
<button onclick="googleLogin()">Login with Google</button>
<button onclick="resetPassword()">Forgot Password</button>

<p id="userStatus">Not logged in</p>
</div>

<!-- FILTER & SEARCH -->
<select id="filter" onchange="filterProducts()">
<option value="all">All Categories</option>
<option value="fashion">Fashion</option>
<option value="gadgets">Gadgets</option>
<option value="shoes">Shoes</option>
</select>
<input id="search" placeholder="Search products..." onkeyup="searchProduct()">

<!-- PRODUCTS LIST -->
<h3 id="products">Products</h3>
<div class="products" id="productList"></div>

<!-- CART -->
<div id="cart">
<h3>Cart</h3>
<ul id="cartItems"></ul>
<p>Total: ₦<span id="total">0</span></p>

<input id="state" placeholder="Enter State">
<input id="coupon" placeholder="Coupon code">
<button onclick="applyDiscount()">Apply Coupon</button>
<button onclick="checkout()">Pay Now</button>

<p>🔒 Secure Payment | 🚚 Fast Delivery | ✅ Trusted Store</p>
</div>

<!-- CUSTOMER REVIEWS -->
<h3>Customer Reviews</h3>
<textarea placeholder="Write review"></textarea>
<button>Submit</button>

<!-- WHATSAPP ORDER -->
<br><br>
<a href="https://wa.me/2348069605684" target="_blank">Order via WhatsApp</a>

</div>

<!-- SCRIPTS -->
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js"></script>
<script src="https://js.paystack.co/v1/inline.js"></script>

<script>
// DARK MODE
function toggleDark(){document.body.classList.toggle("dark");}

// FIREBASE CONFIG
const firebaseConfig = {
  apiKey: "AIzaSyD9KTcTyfrXEb1OY1w_e2m8zwnyxNMcons",
  authDomain: "majaffi-venture2.firebaseapp.com",
  projectId: "majaffi-venture2",
  storageBucket: "majaffi-venture2.firebasestorage.app",
  messagingSenderId: "101326202999",
  appId: "1:101326202999:web:4825cd888f70549a223e72"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth();

// AUTH FUNCTIONS
const provider = new firebase.auth.GoogleAuthProvider();

function signUp(){auth.createUserWithEmailAndPassword(signupEmail.value,signupPassword.value).then(()=>alert("Account created!"));}

function login(){auth.signInWithEmailAndPassword(loginEmail.value,loginPassword.value).then(()=>alert("Login successful!"));}

function googleLogin(){auth.signInWithPopup(provider).then(result=>alert("Logged in as "+result.user.displayName));}

function logout(){auth.signOut();}

function resetPassword(){auth.sendPasswordResetEmail(loginEmail.value).then(()=>alert("Reset email sent")).catch(()=>alert("Enter email first"));}

// SHOW USER STATUS & HIDE LOGIN FORM
auth.onAuthStateChanged(user=>{
  if(user){
    userStatus.innerText = "Welcome, "+user.email;
    document.getElementById("authBox").style.display="none";
    document.getElementById("cart").style.display="block";
  }else{
    userStatus.innerText = "Please login to continue";
    document.getElementById("authBox").style.display="block";
    document.getElementById("cart").style.display="none";
  }
});

// PRODUCT DISPLAY
const productList = document.getElementById("productList");
let products=[], cart=[], total=0;

// LOAD PRODUCTS FROM FIRESTORE
db.collection("products").get().then(snapshot=>{
  snapshot.forEach(doc=>{
    const product = doc.data();
    products.push(product);
    let card = document.createElement("div");
    card.className="card";
    card.dataset.category = product.category;
    card.innerHTML=`<img src="${product.image}"><h4>${product.name}</h4><p>₦${product.price}</p>
    <button onclick='addToCart(${JSON.stringify(product)})'>Add to Cart</button>
    <button onclick="addWishlist('${product.name}')">❤️</button>`;
    productList.appendChild(card);
  });
});

// CART FUNCTIONS
function addToCart(product){
  if(product.stock <=0){alert("Out of Stock"); return;}
  cart.push(product);
  total+=product.price;
  document.getElementById("total").innerText=total;
  const li = document.createElement("li"); li.innerText=product.name+" - ₦"+product.price;
  document.getElementById("cartItems").appendChild(li);
}

// WISHLIST
function addWishlist(name){
  let list = JSON.parse(localStorage.getItem("wish"))||[];
  list.push(name);
  localStorage.setItem("wish",JSON.stringify(list));
  alert("Saved to wishlist");
}

// FILTER
function filterProducts(){
  let value=document.getElementById("filter").value;
  document.querySelectorAll(".card").forEach(card=>{
    card.style.display=(value==="all"||card.dataset.category===value)?"block":"none";
  });
}

// SEARCH
function searchProduct(){
  let term=document.getElementById("search").value.toLowerCase();
  document.querySelectorAll(".card").forEach(card=>{
    card.style.display=card.innerText.toLowerCase().includes(term)?"block":"none";
  });
}

// DELIVERY FEE
function deliveryFee(state){
  state=state.toLowerCase();
  if(state==="lagos") return 1500;
  if(state==="abuja") return 2500;
  return 3000;
}

// COUPON
let discount=0;
const codes={WELCOME10:10, MAJAFFI20:20};
function applyDiscount(){
  let code=document.getElementById("coupon").value;
  if(codes[code]){discount=codes[code];alert("Discount Applied");}
  else alert("Invalid code");
}

// PAYSTACK CHECKOUT
function checkout(){
  const user = auth.currentUser;
  if(!user){alert("Please login before payment"); return;}
  let state=document.getElementById("state").value;
  let delivery = deliveryFee(state);
  let finalTotal = total+delivery;
  finalTotal = finalTotal - (finalTotal*discount/100);
  var handler = PaystackPop.setup({
    key: "YOUR_PAYSTACK_PUBLIC_KEY",
    email: user.email,
    amount: finalTotal*100,
    currency: "NGN",
    callback: function(){
      saveOrder(user.email, finalTotal);
      alert("Payment Successful!");
    }
  });
  handler.openIframe();
}

// SAVE ORDER
function saveOrder(email, totalAmount){
  db.collection("orders").add({
    customer: email,
    items: cart,
    total: totalAmount,
    status: "Pending",
    date: new Date()
  });
}
</script>

</body>
</html>
