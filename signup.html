<!DOCTYPE html>
<html>
<head>
<title>Sign Up - MAJAFFI VENTURE</title>
</head>
<body>

<h2>Create Account</h2>

<input id="email" placeholder="Email"><br><br>
<input id="password" type="password" placeholder="Password"><br><br>

<button onclick="signup()">SignUp</button>
<p>Already have account? <a href="login.html">Login</a></p>

<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyD9KTcTyfrXEb1OY1w_e2m8zwnyxNMcons",
  authDomain: "majaffi-venture2.firebaseapp.com",
  projectId: "majaffi-venture2","
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();

function signup(){
 auth.createUserWithEmailAndPassword(email.value, password.value)
 .then(()=>{
   alert("Account created!");
   window.location.href = "login.html";
 })
 .catch(err => alert(err.message));
}
</script>

</body>
</html>
