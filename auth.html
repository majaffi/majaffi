<!DOCTYPE html>
<html>
<head>
<title>MAJAFFI VENTURE Login</title>
<style>
body{
 font-family: Arial;
 background:#f5f5f5;
 display:flex;
 justify-content:center;
 align-items:center;
 height:100vh;
}
.box{
 background:white;
 padding:25px;
 border-radius:10px;
 text-align:center;
 box-shadow:0 4px 15px rgba(0,0,0,0.2);
}
input{
 width:100%;
 padding:10px;
 margin:8px 0;
}
button{
 padding:10px;
 width:100%;
 background:black;
 color:white;
 border:none;
}
</style>
</head>
<body>

<div class="box">
<h2>MAJAFFI VENTURE</h2>

<input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">

<button onclick="signup()">Sign Up</button>
<button onclick="login()">Login</button>
<button onclick="googleLogin()">Sign in with Google</button>
<button onclick="logout()">Logout</button>

<p id="userInfo"></p>

<p id="msg"></p>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js"></script>

<script>
const firebaseConfig = {

  apiKey: "AIzaSyD9KTcTyfrXEb1OY1w_e2m8zwnyxNMcons",
  authDomain: "majaffi-venture2.firebaseapp.com",
  projectId: "majaffi-venture2",
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();

function signup(){
 auth.createUserWithEmailAndPassword(
   email.value, password.value
 )
 .then(()=> msg.innerHTML="Account created ✔")
 .catch(err=> msg.innerHTML=err.message);
}

function login(){
 auth.signInWithEmailAndPassword(
   email.value, password.value
 )
 .then(()=> {
   msg.innerHTML="Login successful ✔";
   window.location="index.html";
 })
 .catch(err=> msg.innerHTML=err.message);
}
auth.onAuthStateChanged(user => {
  if(user){
    document.getElementById("userInfo").innerHTML =
      "Logged in as " + user.displayName;
  }
});
function googleLogin(){
  const provider = new firebase.auth.GoogleAuthProvider();

  auth.signInWithPopup(provider)
  .then(result => {
    const user = result.user;
    document.getElementById("userInfo").innerHTML =
      "Welcome " + user.displayName;
  })
  .catch(error => alert(error.message));
}
function logout(){
  auth.signOut();
  document.getElementById("userInfo").innerHTML = "";
}
</script>

</body>
</html>
